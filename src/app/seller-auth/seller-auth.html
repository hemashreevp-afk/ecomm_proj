<div class="seller-auth">

    <!-- SIGN UP -->
    @if(!showLogin){
    <div class="sign-up">
        <h1>Seller sign-up</h1>

        <form #sellerSignUp="ngForm" (ngSubmit)="signUp(sellerSignUp)" class="common-form">
            <input class="form-input" type="text" ngModel name="name" placeholder="Enter your name" />
            <input class="form-input" type="text" ngModel name="email" placeholder="Enter your email" />
            <input class="form-input" type="password" ngModel name="password" placeholder="Enter your password" />
            <button class="form-button" type="submit">Sign Up</button>
            <a class="auth-toggle-link" href="#" (click)="openLogin(); $event.preventDefault()">
                Already have an account? Login here
            </a>
        </form>
    </div>
    }

    <!-- LOGIN -->
    @if(showLogin){
    <div class="login">
        <h1>Seller Login</h1>
        <form #sellerLogin="ngForm" (ngSubmit)="login(sellerLogin.form.value)" class="common-form">
            <input class="form-input" type="text" ngModel name="email" placeholder="Enter your email" />
            <input class="form-input" type="password" ngModel name="password" placeholder="Enter your password" />
            <button class="form-button" type="submit">Login</button>
            <a href="#" (click)="openSignUp(); $event.preventDefault()" class="auth-toggle-link">
                Don’t have an account? Sign Up
            </a>
        </form>
    </div>
    }

</div>
