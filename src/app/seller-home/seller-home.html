<div class="product-list">
  <p>Length: {{ productList.length }}</p>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Category</th>
        <th>Colour</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
  <tr *ngFor="let product of productList">
    <td>{{ product.name }}</td>
    <td>{{ product.price }}</td>
    <td>{{ product.category }}</td>
    <td>{{ product.colour }}</td>
    <td>{{ product.description }}</td>
  </tr>
</tbody>
  </table>
</div>
