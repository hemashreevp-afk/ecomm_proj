<div class="product-list">
  <h1>Product List</h1>
  <p>Length: {{ productList.length }}</p>
  <table>
    
    <thead>
      <tr>
        <th>image </th>
        <th>Name</th>
        <th>Price</th>
        <th>Category</th>
        <th>Colour</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
  <tr *ngFor="let product of productList">
    
    
    <td> <img [src]="product.imageUrl" width="100" height="100" /></td>
    <!--<td>{{ product.imageUrl }}</td>-->
    <td>{{ product.name }}</td>
    <td>{{ product.price }}</td>
    <td>{{ product.category }}</td>
    <td>{{ product.colour }}</td>
    <td>{{ product.description }}</td>
    <td>
      <fa-icon  (click)="deleteProduct(product.id)" [icon] ="iconDelete" (click)="deleteProduct(product.id)"></fa-icon>
      <a routerLink='/seller-update-product/{{product.id}}'> <fa-icon  [icon] ="iconEdit" ></fa-icon></a>
      <!--<button (click)="deleteProduct(product.id)">Delete</button>-->
    </td>
  </tr>
</tbody>
  </table>
</div>
